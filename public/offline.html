<!-- frontend/public/offline.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Agro Connect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #f0fdf4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #166534; margin-bottom: 10px; }
        p { color: #6b7280; line-height: 1.6; }
        .btn {
            display: inline-block;
            background: #22c55e;
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-top: 20px;
        }
        .btn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🌾</div>
        <h1>You're Offline</h1>
        <p>Please connect to the internet to browse the marketplace.</p>
        <button class="btn" onclick="window.location.reload()">🔄 Retry</button>
    </div>
</body>
</html>
